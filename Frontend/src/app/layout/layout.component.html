<div class="gc-shell">
  <aside class="gc-sidebar" [class.open]="sidebarOpen">
    <div class="gc-brand">Gestión de Caja</div>

    <nav class="nav flex-column">
      <a *ngFor="let item of menu" class="nav-link" [routerLink]="item.route" routerLinkActive="active" (click)="sidebarOpen = false">
        <span class="material-icons">{{ item.icon }}</span>
        <span>{{ item.name }}</span>
      </a>
    </nav>
  </aside>

  <div class="gc-main">
    <header class="gc-topbar">
      <button type="button" class="btn btn-light btn-sm d-lg-none" (click)="sidebarOpen = !sidebarOpen">Menú</button>

      <div class="ms-auto d-flex align-items-center gap-3">
        <span>{{ session?.fullName }} ({{ session?.rolName }})</span>
        <button type="button" class="btn btn-outline-secondary btn-sm" (click)="logout()">Salir</button>
      </div>
    </header>

    <main class="gc-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
