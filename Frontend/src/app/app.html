<div class="gc-loading" *ngIf="loading.loading$ | async">
  <div class="spinner-border text-light" role="status"></div>
  <span class="text-light mt-2">Procesando...</span>
</div>

<div class="gc-toasts">
  <div
    *ngFor="let toast of notifications.toasts$ | async"
    class="alert shadow-sm d-flex justify-content-between align-items-start gap-3 mb-2"
    [ngClass]="'alert-' + toast.type"
    role="alert"
  >
    <span>{{ toast.message }}</span>
    <button type="button" class="btn-close" aria-label="Cerrar" (click)="notifications.dismiss(toast.id)"></button>
  </div>
</div>

<router-outlet></router-outlet>
