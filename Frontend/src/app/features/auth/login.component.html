<div class="auth-page">
  <div class="card auth-card">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <span class="material-icons auth-logo">router</span>
        <h1 class="h4 mt-2 mb-1">Gestión de Caja</h1>
        <p class="text-muted mb-0">Ingrese con su usuario y contraseña</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="login()" novalidate>
        <div class="mb-3">
          <label for="userName" class="form-label">Usuario</label>
          <input
            id="userName"
            type="text"
            class="form-control"
            formControlName="userName"
            autocomplete="username"
            [class.is-invalid]="submitted && f.userName.invalid"
          />
          <div class="field-error" *ngIf="submitted && f.userName.errors as errors">
            <span *ngIf="errors['required']">Ingrese su usuario.</span>
            <span *ngIf="errors['minlength'] || errors['maxlength']">El usuario tiene entre 8 y 20 caracteres.</span>
            <span *ngIf="errors['pattern']">El usuario solo tiene letras y números.</span>
          </div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <div class="input-group">
            <input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              class="form-control"
              formControlName="password"
              autocomplete="current-password"
              [class.is-invalid]="submitted && f.password.invalid"
            />
            <button type="button" class="btn btn-outline-secondary" (click)="showPassword = !showPassword" aria-label="Mostrar contraseña">
              <span class="material-icons">{{ showPassword ? 'visibility_off' : 'visibility' }}</span>
            </button>
          </div>
          <div class="field-error" *ngIf="submitted && f.password.errors as errors">
            <span *ngIf="errors['required']">Ingrese su contraseña.</span>
            <span *ngIf="errors['minlength'] || errors['maxlength']">La contraseña tiene entre 8 y 30 caracteres.</span>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100">Ingresar</button>
      </form>

      <div class="text-center mt-3">
        <a routerLink="/auth/recover-password">¿Olvidó su contraseña?</a>
      </div>
    </div>
  </div>
</div>
