server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Las peticiones a /api se reenvían al contenedor del backend
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Cualquier otra ruta la resuelve Angular (rutas del lado del cliente)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
